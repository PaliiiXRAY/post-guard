<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e121b" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Shape -->
  <path d="M32 4 L56 14 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V14 Z" fill="url(#darkBg)" stroke="url(#shieldGrad)" stroke-width="2.5" />
  
  <!-- Quantum Key Ring Overlay -->
  <circle cx="32" cy="30" r="16" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />
  <circle cx="32" cy="30" r="11" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />

  <!-- Quantum Lattice Points -->
  <circle cx="32" cy="14" r="2" fill="#10b981" filter="url(#glow)" />
  <circle cx="48" cy="30" r="2" fill="#6366f1" filter="url(#glow)" />
  <circle cx="32" cy="46" r="2" fill="#10b981" filter="url(#glow)" />
  <circle cx="16" cy="30" r="2" fill="#6366f1" filter="url(#glow)" />

  <!-- Monogram PG -->
  <text x="32" y="36" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">PG</text>
</svg>
